packages:
  - 'apps/*'
  - 'packages/*'

# pnpm >=11 blocks postinstall scripts unless a package is listed here.
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true
  unrs-resolver: true
  # Explicitly denied: neither script is needed off Firebase App Hosting, and
  # leaving them unlisted makes a fresh install (Vercel) fail with ERR_PNPM_IGNORED_BUILDS.
  '@firebase/util': false
  protobufjs: false
