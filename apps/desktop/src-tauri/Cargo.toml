[package]
name = "atlas-desktop"
version = "0.1.0"
description = "Tauri v2 desktop shell for the Atlas Practice course platform"
authors = ["Atlas Practice"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# This package is intentionally standalone: the JS monorepo lives above it and
# there is no root Cargo workspace to be inherited from.
[workspace]

[lib]
# `_lib` suffix keeps the library from colliding with the binary target on
# Windows, and is what tauri's mobile entry point expects.
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
parking_lot = "0.12"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Native folder picker. It is the ONLY way a project root is chosen: the user
# grants a directory through the OS dialog, which is what makes reaching outside
# the app sandbox legitimate.
tauri-plugin-dialog = "2"
# Opens the pairing URL in the system browser. Scoped to https in
# capabilities/default.json: this is not a general "open anything" grant.
tauri-plugin-shell = "2"
# The API client lives in Rust so the bearer token never enters the webview.
# rustls rather than the platform TLS stack, so a build does not depend on
# OpenSSL being present on the machine that makes it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# For tests that need a throwaway directory. There was no dev-dependencies
# section at all, so the moment `auth.rs` was declared as a module the whole
# test suite stopped building.
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# `panic = "abort"` is deliberately NOT set. The terminal runs a reader and a
# writer thread per session; with `abort`, a panic on either one would take the
# whole app down (and would make the `catch_unwind` guards in `pty.rs` dead
# code) instead of retiring the one session that failed.
