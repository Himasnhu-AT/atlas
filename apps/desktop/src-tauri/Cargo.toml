[package]
name = "learn-desktop"
version = "0.1.0"
description = "Tauri v2 desktop shell for the Learn AI Practice course platform"
authors = ["Learn AI Practice"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# This package is intentionally standalone: the JS monorepo lives above it and
# there is no root Cargo workspace to be inherited from.
[workspace]

[lib]
# `_lib` suffix keeps the library from colliding with the binary target on
# Windows, and is what tauri's mobile entry point expects.
name = "learn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
parking_lot = "0.12"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Native folder picker. It is the ONLY way a project root is chosen: the user
# grants a directory through the OS dialog, which is what makes reaching outside
# the app sandbox legitimate.
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# `panic = "abort"` is deliberately NOT set. The terminal runs a reader and a
# writer thread per session; with `abort`, a panic on either one would take the
# whole app down (and would make the `catch_unwind` guards in `pty.rs` dead
# code) instead of retiring the one session that failed.
