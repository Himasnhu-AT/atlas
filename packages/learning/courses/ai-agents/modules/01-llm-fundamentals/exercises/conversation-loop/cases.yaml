version: 1
cases:
  TestTrimHistory.test_a_short_conversation_is_returned_whole:
    condition: 'a conversation shorter than the window it is being trimmed to'
    hints:
      - 'A window larger than the history has nothing to cut.'
      - 'The start of the slice cannot go below zero, however large the window is.'
      - 'Clamp the computed start position at zero so the slice covers everything.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTrimHistory.test_keeps_the_last_n_non_system_messages:
    condition: 'a window of two over four ordinary turns plus a system message'
    hints:
      - 'The system message is not one of the messages the window counts.'
      - 'Counting it inside the window costs you one real turn every time.'
      - 'Set the system message aside first, take the window over what is left, and put it back in front.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTrimHistory.test_the_system_message_survives_any_window:
    condition: 'a window of one over twenty turns, tight enough to squeeze the instructions out'
    hints:
      - 'The system message is the instructions. Losing it changes the agent partway through a conversation.'
      - 'It also has to come back at the front, since a system message in the middle is not a system prompt.'
      - 'Exclude it from the slice entirely and prepend it to the result.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTrimHistory.test_works_without_a_system_message:
    condition: 'a conversation that opens on a user turn with no instructions in front of it'
    hints:
      - 'Not every conversation has a system prompt.'
      - 'Treating index zero as the system message pins an ordinary turn that the window should be free to drop.'
      - 'Check the role of the first message before setting it aside, and keep the whole list in play when it is not a system turn.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTrimHistory.test_the_window_never_starts_on_an_orphaned_tool_result:
    condition: 'a window whose first message is a tool result whose matching call was cut off'
    hints:
      - 'A tool result refers back to the call that asked for it. Alone, the provider rejects the request.'
      - 'The message that requested the calls sits before the run of results, so the boundary has to move back to reach it.'
      - 'While the message at the window start is a tool result, step the start back by one.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTrimHistory.test_the_window_may_keep_more_than_keep_last:
    condition: 'a window of two that would split a tool call away from its result'
    hints:
      - 'The window size is a target, not a hard cap.'
      - 'A window one message too long is fine. A window that splits a tool exchange is a rejected request.'
      - 'When the two rules conflict, let the window grow and keep the exchange whole.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTrimHistory.test_the_window_walks_back_over_several_tool_results:
    condition: 'two tool results in a row, both belonging to one assistant turn'
    hints:
      - 'One assistant turn can request several tools, and each answer is its own message.'
      - 'Stepping back a single message is not enough when the run of results is longer than one.'
      - 'Keep stepping back while the message at the boundary is still a tool result, so the whole run is included.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTrimHistory.test_a_window_landing_on_an_assistant_message_is_left_alone:
    condition: 'a window whose first message is an ordinary assistant reply'
    hints:
      - 'Only an orphaned tool result forces the window open. Nothing else does.'
      - 'Walking back on any boundary at all makes the window meaningless.'
      - 'Test the role at the boundary and stop as soon as it is anything other than a tool message.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTrimHistory.test_returns_a_new_list_of_the_same_objects:
    condition: 'a result that must be a fresh list holding the caller''s own message objects'
    hints:
      - 'Handing back the argument itself means the caller and this function share one list.'
      - 'Copying each message, on the other hand, is work nobody asked for and breaks identity.'
      - 'Build a new list, and put the original message objects into it unchanged.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTrimHistory.test_a_keep_last_below_one_is_rejected:
    condition: 'a window of zero, which would send a request with no question in it'
    hints:
      - 'A window has to hold at least the turn being answered.'
      - 'Zero is the caller getting the configuration wrong, not a conversation that needs trimming.'
      - 'Check the window size before touching the messages and raise ValueError.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_a_system_message_starts_the_history:
    condition: 'a conversation constructed with instructions, before any turn is sent'
    hints:
      - 'The system prompt is a message like any other. It is not a separate field on the request.'
      - 'It has to be in the history from the start, not added when the first call is made.'
      - 'Append it to the message list in the constructor when a system prompt was given.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_the_history_starts_empty_without_a_system_message:
    condition: 'a conversation constructed with no instructions at all'
    hints:
      - 'A system prompt is optional, and its absence must not add a placeholder message.'
      - 'An empty system message is not the same as no system message, and the provider sees the difference.'
      - 'Only append the system turn when one was actually passed in.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_the_token_counter_starts_at_zero:
    condition: 'a fresh conversation that has not yet spent anything'
    hints:
      - 'The running total is state on the object, set up before any call happens.'
      - 'Leaving it unset means the first addition raises rather than counting.'
      - 'Initialise the counter to zero in the constructor.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_send_returns_the_reply_text:
    condition: 'a single question whose answer text is what the caller gets back'
    hints:
      - 'The caller wants the words, not the completion object.'
      - 'The text sits on the message inside the first choice.'
      - 'Return the content of the first choice after recording it in the history.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_send_records_both_turns:
    condition: 'one exchange, where both what was asked and what came back belong in the history'
    hints:
      - 'The model keeps nothing. Whatever is not recorded here is gone by the next turn.'
      - 'The reply is as much a part of the history as the question, and it has to be stored under the assistant role.'
      - 'Append the user turn before the call and the assistant turn after it.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_every_turn_resends_the_whole_history:
    condition: 'three turns in a row, where each request must be larger than the last'
    hints:
      - 'The endpoint is stateless. Sending only the newest question makes the model forget everything.'
      - 'The growth is the point: the whole transcript goes on the wire every time.'
      - 'Pass the accumulated message list to the call rather than a list built for this turn.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_assistant_turns_come_back_in_later_requests:
    condition: 'a second request that must carry the first reply between the two questions'
    hints:
      - 'A history of questions with no answers reads as a user repeating themselves.'
      - 'The assistant turn has to be stored under the assistant role, not folded into the next user message.'
      - 'Append the reply with the assistant role so it takes its place in the transcript.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_token_usage_accumulates_across_turns:
    condition: 'a second call whose cost must be added to what the first one spent'
    hints:
      - 'Each response reports only its own usage. Nothing accumulates for you.'
      - 'Overwriting the counter each turn reports the last call rather than the session.'
      - 'Add this call''s total to the running counter instead of assigning it.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_history_returns_a_copy:
    condition: 'a caller appending to the list the accessor handed them'
    hints:
      - 'Returning the internal list lets anything holding it rewrite the conversation.'
      - 'A snapshot is meant to be read, and appending to it must not reach the object.'
      - 'Build a new list on every call rather than handing back the attribute.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_mutating_a_returned_message_does_not_corrupt_the_state:
    condition: 'a caller editing the content of a message inside the returned snapshot'
    hints:
      - 'A new outer list is not enough. The dicts inside it are still the originals.'
      - 'Editing what looks like a read only snapshot should not change the system prompt.'
      - 'Copy each message as you build the list, so the entries are separate objects.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_reset_keeps_the_system_message:
    condition: 'a reset on a conversation that was configured with instructions'
    hints:
      - 'Clearing the history should start a new conversation with the same agent, not a different one.'
      - 'Reading the system message off the current list fails once that list has been cleared.'
      - 'Hold the system prompt as its own attribute in the constructor and rebuild the opening message from it.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_reset_empties_a_conversation_with_no_system_message:
    condition: 'a reset where there were no instructions to restore'
    hints:
      - 'With no system prompt there is nothing to put back, and the history is genuinely empty.'
      - 'Restoring unconditionally inserts a message that was never there.'
      - 'Only re-add the opening message when a system prompt was given.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestConversation.test_reset_keeps_the_token_total:
    condition: 'a reset after money has already been spent on a call'
    hints:
      - 'Clearing the history does not refund anything. Those tokens were billed.'
      - 'A counter that resets with the conversation understates what a session cost.'
      - 'Leave the running total alone and only rebuild the message list.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTruncationAndTheWindow.test_a_truncated_reply_raises:
    condition: 'a reply cut off at the output cap partway through a word'
    hints:
      - 'The fragment reads like an answer, and nothing about the text says it was cut.'
      - 'The evidence is the finish reason on the choice, not the shape of the content.'
      - 'Compare the finish reason against the cap value and raise TruncatedReply when it matches.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTruncationAndTheWindow.test_the_partial_text_is_on_the_exception:
    condition: 'a caller who wants to see how far the cut off reply got'
    hints:
      - 'Throwing the fragment away leaves the caller with no way to retry intelligently or show what happened.'
      - 'The exception is the only thing crossing the boundary, so it has to carry the text.'
      - 'Pass the partial content into the exception and store it as an attribute.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTruncationAndTheWindow.test_a_truncated_reply_never_reaches_the_history:
    condition: 'a cut off reply that must not be recorded as the assistant''s turn'
    hints:
      - 'A fragment in the history becomes the thing every later turn builds on.'
      - 'The model will read its own half sentence as something it meant to say.'
      - 'Raise before appending the assistant turn, leaving only the user question in the history.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTruncationAndTheWindow.test_a_truncated_reply_is_still_billed:
    condition: 'a cut off reply whose tokens were generated and charged for anyway'
    hints:
      - 'Failing the call does not undo the spend. The provider generated those tokens.'
      - 'Counting after the truncation check means every truncated turn goes unbilled in your own numbers.'
      - 'Add the usage to the running total before deciding whether to raise.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTruncationAndTheWindow.test_keep_last_bounds_what_is_sent:
    condition: 'three turns under a window, where the third request must not be larger than the second'
    hints:
      - 'Without a window the request grows forever and eventually will not fit.'
      - 'The trimming has to happen inside the send path, not only when the caller asks for the history.'
      - 'Apply the window to the stored message list on each send, and let it become the new history.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTruncationAndTheWindow.test_the_window_always_contains_the_newest_question:
    condition: 'a window of one, tight enough to trim away the question being asked'
    hints:
      - 'Trimming before appending leaves the window full and pushes the new question outside it.'
      - 'The question is the whole reason for the call, so it cannot be the thing that gets cut.'
      - 'Append the user turn first and trim afterwards, so the newest message is always inside the window.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTruncationAndTheWindow.test_a_keep_last_below_one_is_rejected:
    condition: 'a conversation constructed with a window of zero'
    hints:
      - 'A window of zero would leave the request with no question in it.'
      - 'Failing at construction is better than failing on the first send, when a call is already in flight.'
      - 'Validate the window in the constructor and raise ValueError, while still allowing None for no window.'
    concept: ai-llm-fundamentals.the-conversation-loop

  TestTruncationAndTheWindow.test_no_keep_last_means_no_window:
    condition: 'a conversation constructed without a window, whose history must keep growing'
    hints:
      - 'None means unbounded, and it is not the same as a very large number.'
      - 'A default that trims anyway silently loses turns the caller expected to keep.'
      - 'Skip the trimming step entirely when no window was configured.'
    concept: ai-llm-fundamentals.the-conversation-loop
