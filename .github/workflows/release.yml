# Builds the Windows installers into a draft GitHub Release.
#
# Started by pushing a `v*` tag, which ./release.sh does. The macOS app is not
# built here: it is signed with a Developer ID and notarized on a Mac by
# scripts/release-macos.sh, which uploads into the same draft. Whichever side
# finishes second publishes, so the site's download page (which reads the
# latest published release) never links to a release missing a platform.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.2.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The course content is built once, on Linux. The build runs every
  # exercise's reference against its test with `python3`, which a Windows
  # runner does not reliably provide, and the output is the same everywhere.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm content
      - uses: actions/upload-artifact@v4
        with:
          name: content-dist
          path: packages/learning/dist
          retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the release if this tag already has one (a rerun), else create
          # a draft and take its id from the response. Listing releases straight
          # after creating one can miss it, which once left the build with no id
          # and published an empty release.
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)"
          if [ -z "$id" ]; then
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Atlas Practice $TAG" \
              -F draft=true -F generate_release_notes=true --jq .id)"
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [content, create-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: content-dist
          path: packages/learning/dist
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Compiled into the app: where it syncs progress and signs in.
          ATLAS_API_URL: https://atlas.himanshuat.com
          # Signs the update files. tauri-action writes their entries into the
          # release's latest.json, merging with the macOS ones if those are there.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.id }}
          args: --bundles msi,nsis --config src-tauri/tauri.release.conf.json

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          api="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          # Publish only once latest.json, which installed apps poll, names both
          # systems. scripts/release-macos.sh applies the same rule, so whichever
          # side finishes second publishes, and a lost write leaves a draft.
          manifest="$(gh api "$api" --jq '.assets[] | select(.name == "latest.json") | .id')"
          platforms=""
          if [ -n "$manifest" ]; then
            platforms="$(gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$manifest" | jq -r '.platforms | keys[]')"
          fi
          if [ "$(gh api "$api" --jq .draft)" != "true" ]; then
            echo "Already published."
          elif grep -q '^darwin-aarch64$' <<< "$platforms" && grep -q '^windows-x86_64' <<< "$platforms"; then
            gh api -X PATCH "$api" -F draft=false -f make_latest=true >/dev/null
            echo "Published $TAG."
          else
            echo "Left as a draft until scripts/release-macos.sh adds the notarized macOS build."
          fi
